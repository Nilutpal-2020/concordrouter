version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: concordrouter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: concordpassword
      POSTGRES_DB: concordrouter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: concordrouter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
